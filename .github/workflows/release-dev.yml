name: release-dev

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Refresh Sun on every run and retry while caching the native tools.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          build-args: |
            SUN_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          load: true
          tags: sun_serve-release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test sun_serve
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace sun_serve-release \
            bash -c "scripts/build.sh && scripts/test.sh && sun --version > build/SUN_VERSION"

      # The binary ships in a tarball; the library ships as a bare moon named
      # for its target, the way the Sun toolchain names its own bundles.
      - name: Package the release
        run: |
          mkdir -p release/sun_serve-dev-linux-x86_64
          cp build/sun_serve README.md LICENSE release/sun_serve-dev-linux-x86_64/
          tar -C release -czf release/sun_serve-dev-linux-x86_64.tar.gz \
            sun_serve-dev-linux-x86_64
          cp build/sun_serve.moon release/sun_serve-x86_64-linux-gnu.moon
          cd release
          sha256sum sun_serve-dev-linux-x86_64.tar.gz sun_serve-x86_64-linux-gnu.moon > SHA256SUMS

      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release/NOTES.md <<EOF
          Rolling development build from commit ${GITHUB_SHA}, built with $(cat build/SUN_VERSION).

          - \`sun_serve-dev-linux-x86_64.tar.gz\`: the static file server binary.
          - \`sun_serve-x86_64-linux-gnu.moon\`: the library for Sun programs. Install it as \`sun_serve.moon\` in a directory on your \`sun_path\` (for example \`/usr/lib/sun\`) and list it under \`libraries\` in your manifest. It carries its own OpenSSL and zlib and needs the Sun toolchain it was built with.
          EOF
          gh release delete dev --cleanup-tag --yes || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" || true
          gh release create dev \
            release/sun_serve-dev-linux-x86_64.tar.gz \
            release/sun_serve-x86_64-linux-gnu.moon \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes-file release/NOTES.md \
            --prerelease \
            --latest=false
