name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Refresh Sun on every run and retry while caching the native tools.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          build-args: |
            SUN_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          load: true
          tags: sun_serve-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Format check, build, and test
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace sun_serve-ci \
            bash -c "scripts/build.sh && scripts/test.sh"
